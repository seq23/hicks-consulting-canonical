name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: hicks-consulting-main
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 5  # ~3x median 0.4m over 8 green runs; fault detector, not a budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run validate:all
