name: Agency SEO Monitor

on:
  workflow_dispatch:
    inputs:
      search_truth_only:
        description: 'Run only the Search Console measurement job (truth, coverage, sitemaps)'
        type: boolean
        default: false
  schedule:
    - cron: '23 14 * * *'

concurrency:
  group: hicks-consulting-content-automation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    if: ${{ !inputs.search_truth_only }}
    timeout-minutes: 5  # ~3x median 0.3m over 8 green runs; fault detector, not a budget
    runs-on: ubuntu-latest
    env:
      LIVE_SITE_URL: https://www.hicksconsulting.org
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      # See social-ingestion.yml: passing the revoked EMAIL/PRIVATE_KEY pair
      # shadows the working service-account JSON, because that pair is only
      # bypassed when it is absent entirely.
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      BING_SITE_URL: ${{ secrets.BING_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: git pull --rebase origin main
      - run: npm ci
      - name: Refresh live, GSC, and Bing snapshots
        run: npm run agency:refresh
        continue-on-error: true
      - name: Build GSC free-wins (live grounded observation is off by owner policy)
        run: npm run autonomy:measure
        env:
          # No OPENROUTER_API_KEY and no model here on purpose. The live grounded
          # observation inside this step uses OpenRouter's web plugin, which bills
          # PER REQUEST; running it on this daily schedule pinned to
          # openai/gpt-4o-mini was a standing daily charge against the owner's
          # 11 Oct 2026 policy that nothing is paid. The observer now records the
          # NAMED STOP PAID_PROBE_DISABLED_BY_OWNER_POLICY and exits 0. The probe
          # still exists: paid-citation-probe.yml, dispatch only, confirm_paid.
          LIVE_QUERY_LIMIT: '7'
        continue-on-error: true
      - name: Apply bounded autonomous search repairs
        run: npm run search:repair
        env:
          SEARCH_AUTO_REPAIR: '1'
      - name: Build dashboard and advisory QA report
        run: npm run build
      - name: Verify agency search-intelligence contract
        run: npm run validate:profile:agency
      - name: Commit monitoring snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/agency data/search pages sitemap.xml data/cadence/lastmod_ledger.json)" ]]; then
            git add data/agency data/search pages sitemap.xml data/cadence/lastmod_ledger.json
            git commit -m "Refresh agency SEO monitoring snapshots"
            git push
          else
            echo "No agency monitoring changes to commit."
          fi
      - name: Upload advisory monitoring artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hicks-agency-seo-monitor
          path: |
            data/agency/
            data/search/

  # Measurement half of the search loop (11 Oct 2026). Search Console truth,
  # URL Inspection rotation and the sitemap record are committed daily so every
  # later decision reads a file, not a one-off pull. Measurement only: qualifying
  # demand families are recorded as client proposals; nothing on the site changes.
  search-truth:
    timeout-minutes: 10  # new job: ~139 URL inspections at 8 parallel (~6 s each) plus two Search Analytics calls; fault detector, not a budget
    runs-on: ubuntu-latest
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: git pull --rebase origin main
      - name: Collect Search Console truth, index coverage and sitemaps; build measured targets and family proposals
        run: npm run search:measure
      - name: Verify search truth, coverage and measured URLs
        run: npm run validate:profile:search-truth
      - name: Commit search truth
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain data/search_intelligence)" ]]; then
            echo "No search truth changes to commit."; exit 0
          fi
          git add data/search_intelligence
          git commit -m "Refresh Search Console truth and index coverage"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 5))
          done
          echo "Search truth push failed after 3 attempts." >&2; exit 1
