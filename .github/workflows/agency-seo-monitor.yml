name: Agency SEO Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * *'

concurrency:
  group: hicks-consulting-content-automation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      LIVE_SITE_URL: https://www.hicksconsulting.org
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      # See social-ingestion.yml: passing the revoked EMAIL/PRIVATE_KEY pair
      # shadows the working service-account JSON, because that pair is only
      # bypassed when it is absent entirely.
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      BING_SITE_URL: ${{ secrets.BING_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: git pull --rebase origin main
      - run: npm ci
      - name: Refresh live, GSC, and Bing snapshots
        run: npm run agency:refresh
        continue-on-error: true
      - name: Build GSC free-wins and live grounded query observations
        run: npm run autonomy:measure
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SEARCH_MODEL: gemini-2.5-flash-lite
          LIVE_QUERY_LIMIT: '7'
        continue-on-error: true
      - name: Apply bounded autonomous search repairs
        run: npm run search:repair
        env:
          SEARCH_AUTO_REPAIR: '1'
      - name: Build dashboard and advisory QA report
        run: npm run build
      - name: Verify agency search-intelligence contract
        run: npm run validate:profile:agency
      - name: Commit monitoring snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/agency data/search pages)" ]]; then
            git add data/agency data/search pages
            git commit -m "Refresh agency SEO monitoring snapshots"
            git push
          else
            echo "No agency monitoring changes to commit."
          fi
      - name: Upload advisory monitoring artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hicks-agency-seo-monitor
          path: |
            data/agency/
            data/search/
