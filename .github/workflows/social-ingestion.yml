name: Social Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: '41 14 * * 2,5'

concurrency:
  group: hicks-consulting-content-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: git pull --rebase origin main

      - run: npm ci

      # ingest:all now runs queries:ingest between ingest:social and the rest of the
      # pipeline, so measured Search Console queries are merged into the signal file
      # before it is normalized, clustered, scored, and turned into briefs. Without
      # credentials queries:ingest exits 0 and writes nothing. Existing schedule and
      # publishing cadence are unchanged.
      - name: Ingest signals, including measured Search Console queries
        run: npm run ingest:all
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GSC_SERVICE_ACCOUNT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_ACCESS_TOKEN: ${{ secrets.GSC_ACCESS_TOKEN }}

      - name: Migrate admitted opportunities into Full Safe Autonomy
        run: npm run autonomy:migrate

      - name: Draft, validate, repair, and assign existing cadence slots
        run: npm run autonomy:cycle
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}

      - run: npm run build

      - run: npm run validate:all

      - name: Commit social ingestion outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain data/intake data/social data/autonomy pages/resources pages/llm-atlas llms.txt sitemap.xml)" ]]; then
            git add data/intake data/social data/autonomy pages/resources pages/llm-atlas llms.txt sitemap.xml
            git commit -m "Update autonomous content intelligence and scheduled resources"
            git push
          else
            echo "No social ingestion changes to commit."
          fi
