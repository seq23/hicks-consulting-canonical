name: Validate
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: hicks-consulting-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    timeout-minutes: 5  # ~3x median 0.4m over 8 green runs; fault detector, not a budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run validate:all
