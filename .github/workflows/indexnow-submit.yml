name: Post-Publish Distribution

on:
  workflow_run:
    branches: [main]
    workflows: ["Content Publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hicks-consulting-content-automation
  cancel-in-progress: false

jobs:
  distribute:
    environment: reviewed-main
    timeout-minutes: 7  # ~3x median 2.1m over 8 green runs; fault detector, not a budget
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://www.hicksconsulting.org
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      INDEXNOW_KEY_LOCATION: ${{ secrets.INDEXNOW_KEY_LOCATION }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      GSC_INSPECTION_LIMIT: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: git pull --rebase origin main
      - name: Refresh sitemap and public build after successful client publish
        run: npm run build
      - name: Build priority and batch URL files
        run: npm run indexnow:emit
      - name: Run IndexNow, GSC sitemap submission, and priority URL inspection
        run: npm run distribution:post-publish
      - name: Validate full post-publish distribution contract
        run: |
          npm run validate:authority-modernization
      - name: Send or retry post-publication explanation email
        run: npm run notify:publish
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PUBLICATION_NOTIFICATION_TO: ${{ secrets.PUBLICATION_NOTIFICATION_TO }}
          PUBLICATION_NOTIFICATION_FROM: ${{ secrets.PUBLICATION_NOTIFICATION_FROM }}
        continue-on-error: true
      - name: Commit durable distribution and notification receipts
        run: |
          git config user.name "hicks-distribution-observer"
          git config user.email "actions@github.com"
          git add data/distribution data/autonomy/notification_queue.json
          if git diff --cached --quiet; then
            echo "No distribution or notification receipt changes."
          else
            git commit -m "Record distribution and publication notification receipts"
            # main moves under this job: rebase onto it and retry (bare push rejected, p-n-p 18 Nov 2026).
            for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push origin main && break; [ "$i" = 3 ] && exit 1; sleep $((i*10)); done
          fi
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hicks-consulting-distribution-evidence
          path: |
            data/distribution
            reports/indexnow-priority.txt
            reports/indexnow-batch.txt
            reports/indexnow-manifest.json
