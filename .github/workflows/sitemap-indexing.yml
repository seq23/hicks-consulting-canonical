name: Sitemap Indexing Check
on:
  workflow_dispatch:
concurrency:
  group: hicks-consulting-sitemap-indexing
  cancel-in-progress: false
jobs:
  sitemap-indexing:
    timeout-minutes: 5  # ~3x median 0.2m over 8 green runs; fault detector, not a budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run validate:profile:sitemap-indexing
