name: Editorial Continuity Sidecar
on:
  workflow_dispatch:
  schedule:
    - cron: "10 4 * * 3"  # America/Chicago, all year
      timezone: America/Chicago
concurrency:
  group: hicks-consulting-content-automation
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  continuity:
    timeout-minutes: 5  # ~3x median 0.3m over 8 green runs; fault detector, not a budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: git pull --rebase origin main
      - run: npm ci
      - name: Refresh authority intelligence
        run: npm run authority:cycle
      - name: Replenish future autonomous candidates when runway falls below 120 days
        run: npm run continuity:replenish
      - name: Migrate continuity candidates into autonomous queue
        run: npm run autonomy:migrate
      - name: Validate authority modernization and protected editorial core
        run: npm run validate:authority-modernization
      - name: Commit sidecar and autonomy candidate updates only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/authority_scale data/continuity data/intake/content_brief_candidates.json data/social/publish_queue.json data/autonomy/queue.json
          if git diff --cached --quiet; then echo "No continuity changes."; exit 0; fi
          git commit -m "chore: replenish autonomous editorial continuity at locked velocity"
          # The push is retried on top of a fresh main: on 4 Nov 2026 (run 41813203973) GitHub
          # answered one push with "Internal Server Error" and the week's work was lost.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push attempt $i failed; rebasing on origin/main and retrying"
            sleep $((i * 15))
            git pull --rebase origin main
          done
          echo "::error title=Editorial continuity::NAMED STOP [PUSH_FAILED] three pushes to main failed; the replenished data was not saved"
          exit 1
