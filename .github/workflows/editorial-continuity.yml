name: Editorial Continuity Sidecar
on:
  workflow_dispatch:
  schedule:
    - cron: "41 10 * * 1"
concurrency:
  group: hicks-consulting-content-automation
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: git pull --rebase origin main
      - run: npm ci
      - name: Refresh authority intelligence
        run: npm run authority:cycle
      - name: Replenish future approval candidates when runway falls below 120 days
        run: npm run continuity:replenish
      - name: Validate authority modernization and protected editorial core
        run: npm run validate:authority-modernization
      - name: Commit sidecar candidate updates only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/authority_scale data/continuity data/intake/content_brief_candidates.json data/social/publish_queue.json
          if git diff --cached --quiet; then echo "No continuity changes."; exit 0; fi
          git commit -m "chore: replenish approval-gated editorial continuity"
          git push
