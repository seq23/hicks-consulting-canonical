name: Search Loop

# The shared search growth engine (seq23/search-loop @v1, v1.3.0 or later), owner ruling 1 Nov 2026:
# find easy searches weekly, publish gated question pages daily under /questions/
# on hicksconsulting.org, check every page at 2/4/8 weeks, strengthen / undo /
# merge, and upload the weekly report artifact "search-loop-week".
# Hidden pages only: never in the nav or menu; reached through Related questions
# blocks between question pages, the /questions/ hub (linked from /faq/), the
# sitemap and IndexNow. Client-approved pages are read-only to the engine
# (protected_paths + the site view, .github/scripts/search_loop_site_view.mjs).
# Owner ruling 3 Nov 2026: the lane stays as a search-acceleration lane at 1 page a day (cap.max_per_day),
# hyper-local to Memphis-area communities (virtual, Tennessee only), never on a query a calendar post
# answers (reserved_titles, written by scripts/publishing/write_calendar_slots.mjs), Monika Hicks, LCSW
# as the byline (author); each question page is linked from one related calendar post.
# Throttle every site at once: gh variable set SEARCH_LOOP_MODE --body slow -R seq23/search-loop
on:
  schedule:
    - cron: '53 6 * * *'  # America/Chicago, all year
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      stage:
        description: "auto | find | build | check"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: hicks-consulting-content-automation
  cancel-in-progress: false

jobs:
  search-loop:
    uses: seq23/search-loop/.github/workflows/search-loop.yml@v1.5.1
    with:
      open_loops_business: friends
      engine_ref: v1.5.1
      stage: ${{ inputs.stage || 'auto' }}
      setup_command: npm ci && npm run build && node scripts/publishing/write_calendar_slots.mjs --reserved-only && node .github/scripts/search_loop_site_view.mjs make
      commit_command: bash .github/scripts/search_loop_commit.sh
    secrets:
      BOSS_OPEN_LOOPS_TOKEN: ${{ secrets.BOSS_OPEN_LOOPS_TOKEN }}  # named stops -> Boss OS Open Loops (search-loop v1.7.0)
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      # $0 model lanes (engine v1.2.3): Gemini free tier (no-billing project), metered Workers AI
      # (usage read with the analytics token, model run with the Workers AI token; 600 neurons/day).
      CLOUDFLARE_API_TOKEN: ${{ secrets.SEARCH_LOOP_CF_USAGE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SEARCH_LOOP_CF_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.SEARCH_LOOP_CF_WORKERS_AI_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.SEARCH_LOOP_GEMINI_API_KEY }}
