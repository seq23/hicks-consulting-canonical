name: Full Safe Autonomy Cycle

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hicks-consulting-content-automation
  cancel-in-progress: false

jobs:
  autonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: git pull --rebase origin main
      - run: npm ci
      - name: Ingest current query and content signals
        run: npm run ingest:all
      - name: Admit candidates without changing editorial velocity
        run: npm run autonomy:migrate
      - name: Draft, validate, repair, and assign existing cadence slots
        run: npm run autonomy:cycle
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
      - name: Build the actual site
        run: npm run build
      - name: Run deep site-driven validation
        run: npm run validate:deep
      - name: Commit autonomous output and receipts
        run: |
          git config user.name "hicks-autonomy-bot"
          git config user.email "actions@github.com"
          git add data/intake data/search data/social data/autonomy pages/resources pages/llm-atlas llms.txt sitemap.xml reports
          if git diff --cached --quiet; then
            echo "No autonomy changes."
          else
            git commit -m "Autonomy: create and schedule safe content at locked velocity"
            git push origin main
          fi
