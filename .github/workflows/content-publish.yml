name: Content Publish
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'
  push:
    branches:
      - main
    paths:
      - 'data/admin/content_manifest.json'
concurrency:
  group: hicks-consulting-content-automation
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: git pull --rebase origin main
      - run: npm ci
      # Publishes only items a named human approved in
      # data/admin/publication_approvals.json. status:'approved' in the manifest is
      # written by scripts/autonomy/run_cycle.mjs on its own drafts and has never
      # meant a person agreed to anything; before the gate this step released
      # LLM-drafted pages to a client's live site daily, 113 of them queued into the
      # future. With nothing approved it publishes nothing, says so, and exits 0 -
      # which on a client site is the normal resting state.
      - name: Release human-approved content that is due
        run: npm run publish:content
      # Relink the site to what just published.
      #
      # scripts/navigation/build_internal_navigation.mjs writes the category hub
      # lists, breadcrumbs and related-links blocks into pages/ from the manifest.
      # It was invoked by nothing - not package.json, not CI, not site_build.js -
      # so every release since it landed left the navigation describing the
      # library as it was before that release. On 2026-08-29 that was measurable:
      # two items published, and the insights hub source plus six sibling pages
      # were still pointing at the previous set. It runs here, immediately after
      # the release that changes what it depends on, and its output is committed
      # below. validate:all also runs it in --check mode, so a stale tree is a
      # hard failure rather than a silent one.
      - name: Relink internal navigation to the newly published set
        run: npm run nav:internal
      - run: npm run build
      - run: npm run validate:all
      - name: Commit published status changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Explicit paths. `git add -A` on a scheduled job commits whatever else
          # happens to be in the tree, which on a client site is how unreviewed work
          # reaches production by accident.
          # pages/ is here for the navigation relink only. The step above writes
          # nothing else into it: it replaces the generated hub lists, breadcrumb
          # and related-links blocks and touches no editorial prose.
          git add data/admin/content_manifest.json data/autonomy/exceptions.json data/autonomy/receipts data/social pages sitemap.xml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No release changes to commit - nothing was both due and human-approved."
          else
            git commit -m "Release human-approved content at its scheduled date"
            git push
          fi
